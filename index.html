<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ICN Code of Ethics for Nurses — Interactive Diagram</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 30px 12px;
    display: flex;
    justify-content: center;
  }
  .wrap { max-width: 700px; width: 100%; }
  h1 { font-size: 18px; font-weight: 600; text-align: center; color: #1a2b52; margin: 0 0 4px; }
  .sub { text-align: center; color: #666; font-size: 13px; margin: 0 0 20px; }
  .stage {
    position: relative;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    overflow: hidden;
    user-select: none;
  }
  .stage img { display:block; width:100%; height:auto; }
  .term {
    position: absolute;
    cursor: pointer;
    border-radius: 3px;
  }
  .term:hover, .term:focus { background: rgba(60,90,200,0.14); outline: none; }

  #tooltip {
    position:absolute; max-width:280px; background:#1a2340; color:#f2f4ff;
    font-size:13px; line-height:1.5; padding:10px 12px; border-radius:6px;
    box-shadow:0 4px 14px rgba(0,0,0,0.25); pointer-events:none; z-index:50;
    opacity:0; transition:opacity .12s ease; transform:translateY(4px);
  }
  #tooltip.show { opacity:1; }
  #tooltip .tt-title { font-weight:700; font-size:13px; margin-bottom:4px; color:#ffd48a; }
  #tooltip .tt-src { display:block; margin-top:6px; font-size:11px; color:#9aa3c9; font-style:italic; }

  .legend { text-align:center; font-size:12px; color:#888; margin-top:14px; }

  .voice-panel {
    display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:center;
    background:#fff; border-radius:6px; padding:10px 14px; margin-bottom:14px;
    box-shadow:0 1px 4px rgba(0,0,0,0.1); font-size:13px; color:#333;
  }
  .voice-panel label { display:flex; align-items:center; gap:6px; }
  .voice-panel select, .voice-panel input[type=range] { font-size:13px; }
  .voice-panel select { padding:3px 4px; max-width:220px; }
  .voice-panel .rate-val { min-width:32px; display:inline-block; text-align:right; color:#555; }
  .voice-panel .speak-toggle { display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ICN Code of Ethics for Nurses — Professional Values</h1>
  <p class="sub">Hover (or tap) any word on the diagram for its meaning, in English, as defined in the original PDF.</p>

  <div class="voice-panel">
    <label class="speak-toggle">
      <input type="checkbox" id="speakToggle" checked>
      🔊 Read aloud on hover
    </label>
    <label>
      Voice:
      <select id="voiceSelect"></select>
    </label>
    <label>
      Speed:
      <input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="1">
      <span class="rate-val" id="rateVal">1.0x</span>
    </label>
  </div>

<script>
const DEFS = {
  heading: { title: "Nurses and Patients or People Requiring Care and Services", body: "Nurses' primary professional responsibility is to people requiring nursing care and services now or in the future — whether individuals, families, communities or populations.", src: "Element 1.1" },
  heading2: { title: "Nurses and Practice", body: "Nurses carry personal responsibility and accountability for ethical nursing practice, and for maintaining competence through continuous professional development and lifelong learning.", src: "Element 2.1" },
  band_bl: { title: "Nurses and Global Health", body: "Nurses value health care as a human right, affirming the right to universal access to health care for all. (Heading text not rendered in this PDF export; label restored from the Code's structure.)", src: "Element 4.1" },
  band_br: { title: "Nurses and the Profession", body: "Nurses assume the major leadership role in determining and implementing evidence-informed, acceptable standards of clinical nursing practice, management, research and education. (Heading text not rendered in this PDF export; label restored from the Code's structure.)", src: "Element 3.1" },

  privacy: { title: "Privacy", body: "The right to freedom from intrusion into one's personal matters, information, or one's physical body.", src: "Glossary" },
  confidentiality: { title: "Confidentiality", body: "The nurse's duty to refrain from sharing patient information with third parties unrelated to the patient's care. It is a limited duty and may sometimes be overridden by law, e.g. mandated reporting of specific diseases.", src: "Glossary" },
  competence: { title: "Competence", body: "The integrated knowledge, skills, judgement and attributes a nurse needs to practise safely and ethically in a designated role and setting.", src: "Glossary" },
  equity: { title: "Equity", body: "An aspect of social justice: the absence of systemic disadvantages that result in health disparities for particular segments of society. Equity is essential to the full recognition of human rights.", src: "Glossary" },
  advocacy: { title: "Advocate / advocacy", body: "Actively supporting a right and good cause, or supporting others in speaking for themselves, or speaking on behalf of those who cannot speak for themselves — always carried out with the person's own consent.", src: "Glossary" },
  nurse: { title: "Nurse", body: "A person who has completed a programme of basic, generalised nursing education and is authorised by the appropriate regulatory authority to practise nursing in their country.", src: "Glossary (ICN 1987)" },
  justice: { title: "Social justice", body: "Achieving equity and equality for society and the profession. A form of fairness requiring an impartial distribution of social benefits and burdens, and affirming universal human rights, applicable to all persons.", src: "Glossary" },

  respect: { title: "Respect", body: "Listed as a core professional nursing value; nurses \"support and respect the dignity and universal rights of all people\" (Element 1.8). Not separately defined in the Glossary.", src: "Preamble / Element 1.8" },
  safety: { title: "Safety", body: "Nurses \"facilitate a culture of safety in health care environments, recognising and addressing threats to people and safe care\" (Element 1.9). Not separately defined in the Glossary.", src: "Element 1.9" },
  empathy: { title: "Empathy", body: "One of the professional values nurses demonstrate, alongside respect, justice, responsiveness, caring, compassion, trustworthiness and integrity.", src: "Preamble / Element 1.8" },
  inclusivity: { title: "Inclusivity", body: "Nursing care is described as rooted in traditions of equity and inclusion and appreciation of diversity. Not separately defined in the Glossary.", src: "Preamble" },
  trust: { title: "Trust(worthiness)", body: "Listed among the professional values nurses demonstrate in their contributions to individuals, families, communities and populations.", src: "Preamble" },
  care: { title: "Care(ing)", body: "One of the four fundamental nursing responsibilities nurses have consistently recognised, alongside promoting health, preventing illness and restoring health.", src: "Preamble" },
  leadership: { title: "Leadership", body: "Nurses \"assume the major leadership role in determining and implementing evidence-informed, acceptable standards of clinical nursing practice, management, research and education.\"", src: "Element 3.1" },
  dignity: { title: "Dignity", body: "Nurses uphold \"the dignity, freedom and worth of all human beings\" and value their own dignity, well-being and health. Not separately defined in the Glossary.", src: "Elements 2.4, 4.2" },
  skill: { title: "Skill", body: "Referenced as part of fitness to practice — \"having the skills, knowledge, health and character to do one's job safely and effectively.\"", src: "Glossary: Fitness to practice" },
  compassion: { title: "Compassion", body: "Listed among the professional values nurses demonstrate: respect, justice, empathy, responsiveness, caring, compassion, trustworthiness and integrity.", src: "Preamble" },
  judgement: { title: "(Professional) judgement", body: "Nurses \"practise within the limits of their individual competence ... and use professional judgement when accepting and delegating responsibility.\"", src: "Element 2.3" },
  responsiveness: { title: "Responsiveness", body: "Listed among the professional values nurses demonstrate toward individuals, families, communities and populations.", src: "Preamble" },
  service: { title: "Service", body: "Reflects nurses' role in coordinating services with other health care professionals and related groups. Not separately defined in the Glossary.", src: "Preamble" },
  expertise: { title: "Expertise", body: "Nurses \"share their knowledge and expertise and provide feedback, mentoring and supporting the professional development\" of others.", src: "Element 2.6" },
  solidarity: { title: "Solidarity", body: "Nursing care is rooted in traditions of equity, inclusion and diversity; solidarity is named as part of this foundation. Not separately defined in the Glossary.", src: "Preamble" },
  collaboration: { title: "Collaboration", body: "Nurses \"collaborate with nursing colleagues, other (health) disciplines and relevant communities\" in ethical research and practice development.", src: "Element 3.5" },
  fairness: { title: "Fairness", body: "Underlies social justice, described as \"an impartial distribution of social goods and benefits and an equally impartial distribution of social burdens.\"", src: "Glossary: Social justice" },
  knowledge: { title: "Knowledge", body: "Part of competence — \"the integrated knowledge, skills, judgement and attributes required of a nurse to practise safely and ethically.\"", src: "Glossary: Competence" },
  responsibility: { title: "Responsibility", body: "Nurses \"carry personal responsibility and accountability for ethical nursing practice, and for maintaining competence.\"", src: "Element 2.1" },
  accountability: { title: "Accountability", body: "Nurses \"are accountable for data integrity to support and facilitate ethical standards of care.\"", src: "Element 2.12" },
  publicgood: { title: "Public good", body: "Nurses promote \"responsibility in human rights, equity and fairness and ... the public good and a healthy planet.\"", src: "Element 4.7" },

  dom_clinical: { title: "Clinical practice", body: "One of the domains where nursing practice takes place, alongside education, research, management and leadership, referenced when describing constructive practice environments.", src: "Element 3.4" },
  dom_research: { title: "Research", body: "Nurses and nursing scholars are active in expanding research-based, current professional knowledge that supports evidence-informed practice.", src: "Element 3.2" },
  dom_admin: { title: "Administration", body: "One of the domains of nursing practice named in the Code, alongside clinical care, education, research and leadership.", src: "Element 3.4" },
  dom_education: { title: "Education", body: "Educators and researchers are one of the three groups (with nurses/leaders/managers and National Nurses Associations) the Code calls on to embed its standards into curricula and teaching.", src: "\"Applying the Elements\" tables" },
  dom_policy: { title: "Policy", body: "Nurses lead or contribute to sound health policy development, and National Nurses Associations develop position statements, standards and guidelines.", src: "Element 4.3" },

  lvl_individual: { title: "Individual", body: "One of the levels of people nurses hold primary responsibility toward, as either individuals, families, communities or populations.", src: "Element 1.1" },
  lvl_family: { title: "Family", body: "One of the levels of people nurses hold primary responsibility toward. Family itself is defined as a social unit connected through blood, kinship, or emotional or legal ties.", src: "Element 1.1 / Glossary" },
  lvl_community: { title: "Community", body: "One of the levels of people nurses hold primary responsibility toward, as either individuals, families, communities or populations.", src: "Element 1.1" },
  lvl_population: { title: "Population", body: "One of the levels of people nurses hold primary responsibility toward. Nurses also contribute to population health and the UN Sustainable Development Goals.", src: "Elements 1.1, 4.4" },
};

const tooltip = document.getElementById('tooltip');
const stage = document.getElementById('stage');

// ── Text-to-Speech (Web Speech API) ─────────────────────────────
const synth = window.speechSynthesis;
const voiceSelect = document.getElementById('voiceSelect');
const rateRange = document.getElementById('rateRange');
const rateVal = document.getElementById('rateVal');
const speakToggle = document.getElementById('speakToggle');
let voices = [];

function populateVoices() {
  voices = synth ? synth.getVoices() : [];
  if (!voices.length) return;
  const preferredIdx = voices.findIndex(v => /en(-|_)?(US|GB)?/i.test(v.lang) && v.default);
  voiceSelect.innerHTML = '';
  voices.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${v.name} (${v.lang})`;
    voiceSelect.appendChild(opt);
  });
  const englishIdx = voices.findIndex(v => /^en/i.test(v.lang));
  voiceSelect.value = preferredIdx >= 0 ? preferredIdx : (englishIdx >= 0 ? englishIdx : 0);
}
if (synth) {
  populateVoices();
  synth.onvoiceschanged = populateVoices;
}

rateRange.addEventListener('input', () => {
  rateVal.textContent = parseFloat(rateRange.value).toFixed(1) + 'x';
});

function speak(text) {
  if (!synth || !speakToggle.checked || !text) return;
  synth.cancel(); // ngắt câu đang đọc dở trước khi đọc câu mới
  const utter = new SpeechSynthesisUtterance(text);
  const v = voices[parseInt(voiceSelect.value, 10)];
  if (v) utter.voice = v;
  utter.rate = parseFloat(rateRange.value) || 1;
  utter.lang = v ? v.lang : 'en-US';
  synth.speak(utter);
}
function stopSpeaking() {
  if (synth) synth.cancel();
}

document.querySelectorAll('.term').forEach(el => {
  const key = el.getAttribute('data-def');
  const def = DEFS[key];
  if (!def) return;
  el.tabIndex = 0;

  function show() {
    tooltip.innerHTML = '<div class="tt-title">' + def.title + '</div>' + def.body +
                         '<span class="tt-src">' + def.src + '</span>';
    const stageRect = stage.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();
    let left = elRect.left - stageRect.left + elRect.width / 2 - 130;
    let top = elRect.top - stageRect.top - 10;
    left = Math.max(4, Math.min(left, stage.clientWidth - 284));
    if (top - 90 >= 0) top = top - 90;
    else top = elRect.bottom - stageRect.top + 8;
    tooltip.style.left = left + 'px';
    tooltip.style.top = Math.max(4, top) + 'px';
    tooltip.classList.add('show');
    speak(def.title + '. ' + def.body);
  }
  function hide() {
    tooltip.classList.remove('show');
    stopSpeaking();
  }

  el.addEventListener('mouseenter', show);
  el.addEventListener('mouseleave', hide);
  el.addEventListener('focus', show);
  el.addEventListener('blur', hide);
});
</script>
